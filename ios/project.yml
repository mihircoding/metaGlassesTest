name: NutraVision
options:
  bundleIdPrefix: com.nutravision
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
  MWDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    from: 1.0.0
  NutraCore:
    path: NutraCore
targets:
  NutraVision:
    type: application
    platform: iOS
    sources:
      - path: NutraVision
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: NutraVision/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.nutravision.app
        CODE_SIGN_ENTITLEMENTS: NutraVision/NutraVision.entitlements
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Supabase
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: NutraCore
